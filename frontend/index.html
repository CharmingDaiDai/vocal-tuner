<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocal Tuner</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="app">

  <!-- ── 左侧导航栏 ──────────────────────────────────── -->
  <nav id="sidebar">
    <div class="nav-logo" title="Vocal Tuner">🎤</div>

    <a class="nav-item" id="nav-home"    href="#home"    title="实时音准">
      <span class="nav-icon">📊</span>
      <span class="nav-label">音准</span>
    </a>
    <a class="nav-item" id="nav-library" href="#library" title="音乐分析库">
      <span class="nav-icon">🎵</span>
      <span class="nav-label">曲库</span>
    </a>
    <a class="nav-item" id="nav-karaoke" href="#karaoke" title="跟唱模式">
      <span class="nav-icon">🎤</span>
      <span class="nav-label">跟唱</span>
    </a>
  </nav>

  <!-- ── 页面内容区（路由挂载点）──────────────────────── -->
  <div id="page-root"></div>

</div>

<script type="module">
import { initWsClient }  from '/js/ws-client.js';
import * as router       from '/js/router.js';
import * as homeP        from '/js/pages/page-home.js';
import * as libraryP     from '/js/pages/page-library.js';
import * as karaokeP     from '/js/pages/page-karaoke.js';

// ── WebSocket 单例（跨页面保持连接）──────────────────────
initWsClient();

// ── 注册路由 ──────────────────────────────────────────────
const navItems = {
  home:    document.getElementById('nav-home'),
  library: document.getElementById('nav-library'),
  karaoke: document.getElementById('nav-karaoke'),
};

router.register('home',    homeP);
router.register('library', libraryP);
router.register('karaoke', karaokeP);

// ── 导航栏高亮 + 跟唱全屏处理 ─────────────────────────────
function onNavigate(pageName) {
  const sidebar = document.getElementById('sidebar');
  const appEl   = document.getElementById('app');
  if (pageName === 'karaoke') {
    sidebar?.classList.add('hidden-karaoke');
    appEl?.classList.add('karaoke-mode');
  } else {
    sidebar?.classList.remove('hidden-karaoke');
    appEl?.classList.remove('karaoke-mode');
  }
  for (const [name, el] of Object.entries(navItems)) {
    el?.classList.toggle('active', name === pageName);
  }
}

// ── 启动 ──────────────────────────────────────────────────
router.init(document.getElementById('page-root'), onNavigate);
router.start('home');
</script>
</body>
</html>
